<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats | Harazimiyya</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/chat-list.css">
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https:;
        connect-src 'self' https://lsbgpfvxmngjynvccujw.supabase.co https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.cloudinary.com https://*.cloudinary.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://*.cloudinary.com https://*.supabase.co https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: https: https://*.cloudinary.com https://*.supabase.co blob:;
        media-src 'self' https://*.cloudinary.com https://*.supabase.co blob: data:;
        frame-src 'self' https://*.youtube.com https://*.vimeo.com;
        worker-src 'self' blob:;
    ">
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<div class="deepseek-sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <i class="fas fa-mosque"></i>
            <span class="logo-text">Harazimiyya</span>
        </div>
        <button class="close-sidebar" id="closeSidebar">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="user-profile">
        <div class="user-avatar" id="sidebarUserAvatar">
            <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
            <h4 id="userName">Member</h4>
            <p><i class="fas fa-user-tag"></i> Community Member</p>
        </div>
    </div>
    
    <div class="sidebar-menu">
        <div class="menu-section">
            <h5 class="menu-title">MAIN</h5>
            <ul class="menu-items">
                <li><a href="home.html"><i class="fas fa-home"></i><span>Home</span></a></li>
                <li class="active"><a href="chat-list.html"><i class="fas fa-comments"></i><span>Chats</span></a></li>
                <li><a href="events.html"><i class="fas fa-calendar"></i><span>Programs</span></a></li>
                <li><a href="gallery.html"><i class="fas fa-images"></i><span>Gallery</span></a></li>
                <li><a href="sheikh-history.html"><i class="fas fa-star-and-crescent"></i><span>Sheikh History</span></a></li>
                <li><a href="announcement.html"><i class="fas fa-bullhorn"></i><span>Announcements</span></a></li>
                <li><a href="map.html"><i class="fas fa-map-marker-alt"></i><span>Map</span></a></li>
                <li><a href="admin.html"><i class="fas fa-user-shield"></i><span>Admin</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn-sidebar" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
            </div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- ===== MAIN CHAT LIST ===== -->
<main class="chat-list-container">
    <!-- Header -->
    <header class="chat-header">
        <div class="header-left">
            <button class="menu-btn" id="openSidebar"><i class="fas fa-bars"></i></button>
            <div class="header-title">
                <h1>Chats</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="profile-btn" id="profileBtn">
                <i class="fas fa-user-circle"></i>
            </button>
        </div>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search members or groups..." autocomplete="off">
            <button class="clear-search" id="clearSearch" style="display: none;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <i class="fas fa-spinner fa-spin"></i>
        <span id="loadingText">Loading...</span>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
        <button class="tab active" data-tab="all">All</button>
        <button class="tab" data-tab="community">Community</button>
        <button class="tab" data-tab="groups">Groups</button>
        <button class="tab" data-tab="private">Private</button>
    </div>

    <!-- Chat List -->
    <div class="chat-list" id="chatList">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i> Loading chats...
        </div>
    </div>

    <!-- FAB - New Group -->
    <button class="fab" id="fabBtn" title="Create New Group">
        <i class="fas fa-plus"></i>
    </button>
</main>

<!-- ===== NEW GROUP MODAL ===== -->
<div id="groupModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-users"></i> Create New Group</h3>
            <button class="modal-close" id="closeGroupModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Group Name *</label>
                <input type="text" id="groupNameInput" placeholder="Enter group name" maxlength="50">
            </div>
            <div class="form-group">
                <label>Select Members</label>
                <div class="group-member-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="groupMemberSearch" placeholder="Search members...">
                </div>
                <div id="groupMemberList" class="member-list">
                    <div class="loading-members">Loading members...</div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="ghost-btn" id="cancelGroupBtn">Cancel</button>
            <button class="primary-btn" id="createGroupBtn">Create Group</button>
        </div>
    </div>
</div>

<!-- ===== DELETE CHAT MODAL ===== -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content delete-modal">
        <div class="delete-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h3>Delete Chat?</h3>
        <p>What would you like to do?</p>
        <div class="delete-options">
            <button class="delete-option" id="deleteForMe">
                <i class="fas fa-user"></i> Delete for Me
                <small>Remove from your chat list</small>
            </button>
            <button class="delete-option danger" id="deleteForAll">
                <i class="fas fa-users"></i> Delete for All
                <small>Remove for everyone</small>
            </button>
        </div>
        <button class="ghost-btn" id="cancelDeleteBtn">Cancel</button>
    </div>
</div>

<!-- ===== BOTTOM NAVIGATION ===== -->
<nav class="bottom-nav">
    <a href="home.html" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <a href="chat-list.html" class="nav-item active">
        <i class="fas fa-comments"></i>
        <span>Chats</span>
    </a>
    <a href="events.html" class="nav-item">
        <i class="fas fa-calendar"></i>
        <span>Events</span>
    </a>
    <a href="map.html" class="nav-item">
        <i class="fas fa-map-marker-alt"></i>
        <span>Map</span>
    </a>
    <a href="admin.html" class="nav-item">
        <i class="fas fa-user-shield"></i>
        <span>Admin</span>
    </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/chat-list.js"></script>

</body>
</html>
