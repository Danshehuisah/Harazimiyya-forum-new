<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Community Chat | Harazimiyya</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/chat-view.css">
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https:;
        connect-src 'self' https://lsbgpfvxmngjynvccujw.supabase.co https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.cloudinary.com https://*.cloudinary.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://*.cloudinary.com https://*.supabase.co https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;
        font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: https: https://*.cloudinary.com https://*.supabase.co blob:;
        media-src 'self' https://*.cloudinary.com https://*.supabase.co blob: data:;
        frame-src 'self' https://*.youtube.com https://*.vimeo.com;
        worker-src 'self' blob:;
    ">
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<div class="deepseek-sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-area">
            <i class="fas fa-mosque"></i>
            <span class="logo-text">Harazimiyya</span>
        </div>
        <button class="close-sidebar" id="closeSidebar">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="user-profile">
        <div class="user-avatar" id="sidebarUserAvatar">
            <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
            <h4 id="userName">Member</h4>
            <p><i class="fas fa-user-tag"></i> Community Member</p>
        </div>
    </div>
    
    <div class="sidebar-menu">
        <div class="menu-section">
            <h5 class="menu-title">MAIN</h5>
            <ul class="menu-items">
                <li><a href="home.html"><i class="fas fa-home"></i><span>Home</span></a></li>
                <li><a href="chat-list.html"><i class="fas fa-comments"></i><span>Chats</span></a></li>
                <li><a href="events.html"><i class="fas fa-calendar"></i><span>Programs</span></a></li>
                <li><a href="gallery.html"><i class="fas fa-images"></i><span>Gallery</span></a></li>
                <li><a href="sheikh-history.html"><i class="fas fa-star-and-crescent"></i><span>Sheikh History</span></a></li>
                <li><a href="announcement.html"><i class="fas fa-bullhorn"></i><span>Announcements</span></a></li>
                <li><a href="map.html"><i class="fas fa-map-marker-alt"></i><span>Map</span></a></li>
                <li><a href="admin.html"><i class="fas fa-user-shield"></i><span>Admin</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn-sidebar" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
            </div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- ===== CHAT VIEW ===== -->
<main class="chat-view-container">
    <!-- Header -->
    <header class="chat-header">
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='chat-list.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-avatar" id="chatAvatar">
                <div class="avatar-fallback" style="background: rgba(255,215,0,0.15); color: #ffd700;">
                    👑
                </div>
            </div>
            <div class="header-info">
                <h3 id="chatTitle">📌 Harazimiyya Community</h3>
                <p class="header-subtitle" id="chatSubtitle">Public forum for all members</p>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" id="themeToggle">
                <i class="fas fa-palette"></i>
            </button>
        </div>
    </header>

    <!-- Messages -->
    <div id="messages" class="messages"></div>

    <!-- Reply Indicator -->
    <div id="replyIndicator" class="reply-indicator" style="display: none;">
        <div class="reply-indicator-content">
            <i class="fas fa-reply"></i>
            <div class="reply-indicator-text">
                <span>Replying to <span id="replyName">User</span></span>
                <p id="replyPreview">Message preview</p>
            </div>
        </div>
        <button class="reply-indicator-close" id="cancelReplyBtn">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Input Area -->
    <footer class="chat-input-area">
        <textarea id="messageInput" class="message-input" placeholder="Write a message..." rows="1"></textarea>
        <input type="file" id="fileInput" hidden accept="image/*,video/*">
        <div class="media-buttons-wrapper">
            <button id="imageBtn" class="media-btn" title="Image"><i class="fas fa-image"></i></button>
            <button id="voiceBtn" class="media-btn" title="Voice"><i class="fas fa-microphone"></i></button>
            <button id="videoBtn" class="media-btn" title="Video"><i class="fas fa-video"></i></button>
            <button id="sendBtn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </footer>
</main>

<div id="recordingTimer" class="recording-timer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/community.js"></script>

</body>
</html>
