<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a1f1a;
            color: #f1f5f4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0c8f5f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .icon {
            font-size: 48px;
            color: #0c8f5f;
            margin-bottom: 16px;
        }
        h2 {
            color: #f1f5f4;
            margin-bottom: 8px;
        }
        p {
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🕌</div>
        <h2>Authenticating...</h2>
        <p>Please wait while we complete your sign in</p>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
        // ============================================================
        // OAUTH CALLBACK HANDLER - PKCE FLOW
        // Supports: Vercel, GitHub Pages, Local development
        // ============================================================

        function getBasePath() {
            const origin = window.location.origin;
            const path = window.location.pathname;

            // GitHub Pages: https://user.github.io/repo-name/html/auth-callback.html
            if (origin.includes('github.io')) {
                const repoRoot = path.substring(0, path.indexOf('/html/'));
                return origin + repoRoot;
            }

            // Vercel (or any non-local production host)
            if (origin.includes('vercel.app')) {
                return origin;
            }

            // Local development fallback
            return origin + '/www';
        }

        const basePath = getBasePath();

        async function handleCallback() {
            try {
                console.log("🔄 Processing OAuth callback...");
                console.log("📁 Base path:", basePath);

                const url = new URL(window.location.href);
                const code = url.searchParams.get('code');

                let session = null;

                if (code) {
                    // PKCE flow: exchange authorization code for session
                    console.log("🔑 Exchanging code for session...");
                    const { data, error } = await window.supabase.auth.exchangeCodeForSession(code);

                    if (error) {
                        console.error("Code exchange error:", error);
                        window.location.href = basePath + '/index.html';
                        return;
                    }

                    session = data?.session;
                } else {
                    // Fallback: check if session already exists
                    const { data: { session: existingSession } } = await window.supabase.auth.getSession();
                    session = existingSession;
                }

                if (!session) {
                    console.log("No session found");
                    window.location.href = basePath + '/index.html';
                    return;
                }

                const user = session.user;
                console.log("✅ User authenticated:", user.email);

                const { data: profile, error: profileError } = await window.supabase
                    .from('profiles')
                    .select('role, is_approved')
                    .eq('id', user.id)
                    .single();

                if (profileError) {
                    console.warn("Profile fetch warning:", profileError);

                    if (profileError.code === 'PGRST116') {
                        console.log("Creating profile for Google user...");
                        const { error: insertError } = await window.supabase
                            .from('profiles')
                            .insert([{
                                id: user.id,
                                email: user.email,
                                full_name: user.user_metadata?.full_name || user.email,
                                role: 'member',
                                is_approved: false,
                                created_at: new Date().toISOString()
                            }]);

                        if (insertError) {
                            console.error("Error creating profile:", insertError);
                            window.location.href = basePath + '/index.html';
                            return;
                        }

                        window.location.href = basePath + '/html/home.html';
                        return;
                    }

                    window.location.href = basePath + '/index.html';
                    return;
                }

                if (!profile.is_approved) {
                    await window.supabase.auth.signOut();
                    alert('⏳ Your account is waiting for admin approval. You\'ll receive an email once approved!');
                    window.location.href = basePath + '/index.html';
                    return;
                }

                if (profile.role === 'admin' || profile.role === 'small_admin') {
                    console.log("Redirecting to admin dashboard");
                    window.location.href = basePath + '/html/admin.html';
                } else {
                    console.log("Redirecting to home page");
                    window.location.href = basePath + '/html/home.html';
                }

            } catch (err) {
                console.error("Callback error:", err);
                window.location.href = basePath + '/index.html';
            }
        }

        handleCallback();
    </script>
</body>
</html>
