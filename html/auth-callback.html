<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: #0a1f1a; color: #f1f5f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 20px;
        }
        .container { text-align: center; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0c8f5f; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .icon { font-size: 48px; color: #0c8f5f; margin-bottom: 16px; }
        h2 { color: #f1f5f4; margin-bottom: 8px; }
        p { color: #9ca3af; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🕌</div>
        <h2 id="statusText">Authenticating...</h2>
        <p id="subText">Please wait while we complete your sign in</p>
        <div class="spinner" id="loadingSpinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Assuming supabase.js initializes window.supabase -->
    <script src="../js/supabase.js"></script>
    
    <script>
        function getBasePath() {
            const hostname = window.location.hostname;
            const origin = window.location.origin;
            if (hostname.includes('github.io')) {
                const path = window.location.pathname;
                return origin + path.substring(0, path.indexOf('/html/'));
            }
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return window.location.pathname.includes('/www/') ? origin + '/www' : origin;
            }
            return origin;
        }

        const basePath = getBasePath();
        const isNative = window.Capacitor && window.Capacitor.isNativePlatform();

        async function handleCallback() {
            try {
                const url = new URL(window.location.href);
                const code = url.searchParams.get('code');
                let session = null;

                if (code) {
                    const { data, error } = await window.supabase.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                    session = data?.session;
                } else {
                    const { data: { session: existingSession } } = await window.supabase.auth.getSession();
                    session = existingSession;
                }

                if (!session) {
                    window.location.href = basePath + '/index.html';
                    return;
                }

                // 🟢 BRIDGE LOGIC: If Native App, pass tokens via Custom Scheme
                if (isNative) {
                    const accessToken = session.access_token;
                    const refreshToken = session.refresh_token;
                    const deepLink = `com.harazimiyya.forum://auth/callback#access_token=${accessToken}&refresh_token=${refreshToken}`;
                    
                    document.getElementById('statusText').innerText = "Opening App...";
                    document.getElementById('subText').innerText = "Redirecting you to the Harazimiyya app.";
                    
                    // Trigger deep link
                    window.location.href = deepLink;

                    // Fallback if app is not installed
                    setTimeout(() => {
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('statusText').innerText = "App not opening?";
                        document.getElementById('subText').innerHTML = "Please ensure the app is installed, or <a href='" + basePath + "/html/home.html' style='color:#0c8f5f;'>click here to use the Web App</a>.";
                    }, 2500);
                    return;
                }

                // 🔵 PWA / WEB LOGIC: Redirect normally
                const user = session.user;
                const { data: profile, error: profileError } = await window.supabase
                    .from('profiles')
                    .select('role, is_approved')
                    .eq('id', user.id)
                    .single();

                if (profileError && profileError.code === 'PGRST116') {
                    // Create profile for new Google user
                    const { error: insertError } = await window.supabase
                        .from('profiles')
                        .insert([{
                            id: user.id, email: user.email,
                            full_name: user.user_metadata?.full_name || user.email,
                            role: 'member', is_approved: false, created_at: new Date().toISOString()
                        }]);

                    if (insertError) throw insertError;
                    window.location.href = basePath + '/html/pending-approval.html';
                    return;
                }

                if (profileError) throw profileError;

                if (!profile.is_approved) {
                    window.location.href = basePath + '/html/pending-approval.html';
                } else if (profile.role === 'admin' || profile.role === 'small_admin') {
                    window.location.href = basePath + '/html/admin.html';
                } else {
                    window.location.href = basePath + '/html/home.html';
                }

            } catch (err) {
                console.error("Callback error:", err);
                document.getElementById('statusText').innerText = "Authentication Failed";
                document.getElementById('subText').innerText = "Redirecting back to login...";
                setTimeout(() => window.location.href = basePath + '/index.html', 2000);
            }
        }

        handleCallback();
    </script>
</body>
</html>
