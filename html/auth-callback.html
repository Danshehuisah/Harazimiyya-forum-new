<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a1f1a;
            color: #f1f5f4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #0c8f5f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .icon {
            font-size: 48px;
            color: #0c8f5f;
            margin-bottom: 16px;
        }
        h2 {
            color: #f1f5f4;
            margin-bottom: 8px;
        }
        p {
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🕌</div>
        <h2>Authenticating...</h2>
        <p>Please wait while we complete your sign in</p>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
        // ============================================================
        // OAUTH CALLBACK HANDLER - WORKS FOR BOTH LOCAL & GITHUB PAGES
        // ============================================================

        // Determine the base path for redirects
        function getBasePath() {
            const origin = window.location.origin;
            const path = window.location.pathname;
            
            // If on GitHub Pages, get the base path (everything before /html/auth-callback.html)
            if (origin.includes('github.io')) {
                const basePath = path.substring(0, path.lastIndexOf('/html/'));
                return origin + basePath;
            }
            
            // Local development
            return origin + '/www';
        }

        const basePath = getBasePath();

        async function handleCallback() {
            try {
                console.log("🔄 Processing OAuth callback...");
                console.log("📁 Base path:", basePath);

                // Get the current session
                const { data: { session }, error: sessionError } = await window.supabase.auth.getSession();

                if (sessionError) {
                    console.error("Session error:", sessionError);
                    window.location.href = basePath + '/index.html';
                    return;
                }

                if (!session) {
                    console.log("No session found, checking URL for tokens...");

                    const urlParams = new URLSearchParams(window.location.search);
                    const accessToken = urlParams.get('access_token');
                    const refreshToken = urlParams.get('refresh_token');

                    if (accessToken) {
                        const { error: setError } = await window.supabase.auth.setSession({
                            access_token: accessToken,
                            refresh_token: refreshToken || ''
                        });

                        if (setError) {
                            console.error("Error setting session:", setError);
                            window.location.href = basePath + '/index.html';
                            return;
                        }
                    } else {
                        console.log("No tokens found in URL");
                        window.location.href = basePath + '/index.html';
                        return;
                    }
                }

                const { data: { user }, error: userError } = await window.supabase.auth.getUser();

                if (userError || !user) {
                    console.error("User error:", userError);
                    window.location.href = basePath + '/index.html';
                    return;
                }

                console.log("✅ User authenticated:", user.email);

                const { data: profile, error: profileError } = await window.supabase
                    .from('profiles')
                    .select('role, is_approved')
                    .eq('id', user.id)
                    .single();

                if (profileError) {
                    console.warn("Profile fetch warning:", profileError);
                    
                    if (profileError.code === 'PGRST116') {
                        console.log("Creating profile for Google user...");
                        const { error: insertError } = await window.supabase
                            .from('profiles')
                            .insert([{
                                id: user.id,
                                email: user.email,
                                full_name: user.user_metadata?.full_name || user.email,
                                role: 'member',
                                is_approved: true,
                                created_at: new Date().toISOString()
                            }]);
                        
                        if (insertError) {
                            console.error("Error creating profile:", insertError);
                            window.location.href = basePath + '/index.html';
                            return;
                        }
                        
                        window.location.href = basePath + '/html/home.html';
                        return;
                    }
                    
                    window.location.href = basePath + '/index.html';
                    return;
                }

                if (!profile.is_approved) {
                    await window.supabase.auth.signOut();
                    alert('⏳ Your account is waiting for admin approval. You\'ll receive an email once approved!');
                    window.location.href = basePath + '/index.html';
                    return;
                }

                if (profile.role === 'admin' || profile.role === 'small_admin') {
                    console.log("Redirecting to admin dashboard");
                    window.location.href = basePath + '/html/admin.html';
                } else {
                    console.log("Redirecting to home page");
                    window.location.href = basePath + '/html/home.html';
                }

            } catch (err) {
                console.error("Callback error:", err);
                window.location.href = basePath + '/index.html';
            }
        }

        handleCallback();
    </script>
</body>
</html>
