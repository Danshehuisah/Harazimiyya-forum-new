<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reset-password.css">

<script src="https://unpkg.com/@capacitor/core/dist/index.js"></script>

<meta http-equiv="Content-Security-Policy" content="
    default-src 'self' https:;
    connect-src 'self' https://lsbgpfvxmngjynvccujw.supabase.co https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.cloudinary.com https://*.cloudinary.com;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://*.cloudinary.com https://*.supabase.co https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com;

<body>
    <header class="app-header">
        <h1>Harazimiyya Forum</h1>
        <p class="subtitle">Create New Password</p>
    </header>

    <main class="container">
        <section class="card" id="resetCard">
            <h2>Set New Password</h2>
            
            <p class="reset-description">
                Enter your new password below.
            </p>
            
            <div class="password-container">
                <input type="password" id="newPassword" placeholder="New Password (min 6 characters)" />
                <button type="button" class="password-toggle" id="toggleNewPassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" />
                <button type="button" class="password-toggle" id="toggleConfirmPassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            
            <button id="updatePasswordBtn">Update Password</button>
            
            <p class="switch"><a href="index.html" class="back-link">Back to Login</a></p>
        </section>
    </main>

    <footer class="app-footer">
        <small>© 2026 Harazimiyya Forum. All rights reserved.</small>
    </footer>
